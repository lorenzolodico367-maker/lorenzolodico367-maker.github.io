<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>LD Coding – Paiement</title>
<style>
  :root{
    --bg:#000000; --card:#111111; --ink:#ffffff; --muted:#9a9a9a;
    --line:#262626; --ok:#ffffff;
    --revolut:#ffffff; --payconiq:#ff4785;
    --radius:16px;
  }
  html{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.4;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  main{max-width:480px;margin:0 auto;padding:20px 16px 32px}
  header{text-align:center;padding:4px 0 6px}
  .brand{padding:8px 0 14px}
  .brand img{display:block;width:100%;max-width:340px;height:auto;margin:0 auto}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .subtitle{margin:0;color:var(--ink);font-size:19px;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:14px}
  .card h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 12px;font-weight:600}
  .field{margin-bottom:14px}
  .label{font-size:13px;color:var(--muted);margin-bottom:2px}
  .value{font-size:20px;font-weight:600;word-break:break-word;-webkit-user-select:all;user-select:all}
  .value.iban{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:19px;letter-spacing:.02em}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    min-height:56px;padding:14px 18px;border-radius:14px;border:0;cursor:pointer;
    font:inherit;font-size:18px;font-weight:600;text-decoration:none;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  }
  .btn:active{transform:scale(.985)}
  .btn-outline{background:transparent;color:#fff;border:2px solid #fff}
  .btn-revolut{background:#fff;color:#000;min-height:64px;font-size:20px}
  .btn-payconiq{background:var(--payconiq);color:#fff;min-height:64px;font-size:20px}
  .btn + .btn{margin-top:10px}
  .btn.copied{background:#fff;color:#000;border-color:#fff}
  .hint{font-size:14px;color:var(--muted);margin:12px 0 0}
  .qr{display:block;margin:14px auto 0;max-width:220px;width:100%;border-radius:12px;border:1px solid var(--line)}
  .toast{
    position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(20px);opacity:0;
    background:#fff;color:#000;padding:12px 18px;border-radius:999px;
    font-weight:600;font-size:16px;transition:.2s;pointer-events:none;white-space:nowrap
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}
  [hidden]{display:none!important}
</style>
</head>

<script>
/* =========================================================
   CONFIGURATION — seule partie à modifier
   ========================================================= */
const CONFIG = {
  titulaire:   "Lorenzo Lo Dico",
  iban:        "BE47 6505 6327 4680",
  bic:         "REVOBEB2",
  revolutUrl:  "https://revolut.me/lorenzo_lodico",
  payconiqUrl: "",   // lien officiel Bancontact Pay (vide = section masquée)
  payconiqQr:  ""    // image du QR officiel (vide = aucune)
};
/* ========================================================= */

const $ = id => document.getElementById(id);
const ibanRaw = CONFIG.iban.replace(/\s+/g, "").toUpperCase();
const ibanPretty = ibanRaw.replace(/(.{4})/g, "$1 ").trim();

// Virement
if (CONFIG.titulaire && ibanRaw) {
  $("holder").textContent = CONFIG.titulaire;
  $("iban").textContent = ibanPretty;
  if (CONFIG.bic) { $("bic-line").textContent = "BIC : " + CONFIG.bic; $("bic-line").hidden = false; }
} else {
  $("sec-virement").hidden = true;
}

// Revolut
if (CONFIG.revolutUrl) { $("revolut-link").href = CONFIG.revolutUrl; }
else { $("sec-revolut").hidden = true; }

// Payconiq — affiché uniquement si un lien ou un QR officiel est fourni
if (CONFIG.payconiqUrl || CONFIG.payconiqQr) {
  $("sec-payconiq").hidden = false;
  if (CONFIG.payconiqUrl) { $("payconiq-link").href = CONFIG.payconiqUrl; $("payconiq-link").hidden = false; }
  if (CONFIG.payconiqQr)  { $("payconiq-qr").src = CONFIG.payconiqQr;    $("payconiq-qr").hidden = false; }
}


// Copie presse-papiers (avec repli pour anciens navigateurs)
let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}
function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", "");
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  return ok;
}
async function copy(text, btn, msg) {
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; }
  } catch (e) {}
  if (!ok) ok = fallbackCopy(text);
  if (ok) {
    toast(msg);
    const label = btn.textContent;
    btn.classList.add("copied"); btn.textContent = "✓ Copié";
    setTimeout(() => { btn.classList.remove("copied"); btn.textContent = label; }, 1800);
  } else {
    toast("Copie impossible – sélectionnez le texte");
  }
}
$("copy-iban").addEventListener("click", e => copy(ibanRaw, e.currentTarget, "IBAN copié"));
$("copy-holder").addEventListener("click", e => copy(CONFIG.titulaire, e.currentTarget, "Nom du titulaire copié"));
</script>
